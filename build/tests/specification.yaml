      - The visible Tests line states a concrete result, not a proposed command represented as a result; red/green execution and candidate binding require separate traces/artifacts.
      - 'Return Next: review and the report path, not reviewer approval or a claim that all global gates close automatically. Saved requirement status and telemetry caveat coverage remain UNVERIFIED without the report bytes.'
    assert:
      trace:
        require_calls:
          - tool: bash
