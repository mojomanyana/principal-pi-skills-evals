    checklist:
      - Block on missing finding meaning/source report and acceptance; do not infer a change from REV-001 or the implementation.
      - 'Name the caller handoff repair required and return Next: blocked; no production or test changes are authorized by a bare finding ID.'
      - Do not claim red/green, applied fix or reviewer acceptance from an unidentified finding; report evidence missing explicitly.
