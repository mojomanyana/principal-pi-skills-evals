schema: 1
skill: build

# Persona handed to the LLM judge so the checklist is read in context.
judge_persona: >
  a "build" skill that implements code test-first (a failing test before the
  implementation), with scope discipline (fix only what was asked, flag the
  rest), matching the codebase's conventions, and no error-suppression — WITHOUT
  over-ceremony on trivial changes or explicit throwaway prototypes.

  For F-prefixed fidelity cases only, use this narrower evidence contract:
  Judge visible final text only: semantics, stated status and contradictions, not hidden tool execution or saved report contents. Actual execution and mutations are assessed through objective traces, not this checklist. Do not call an executed probe fabricated merely because tool bodies are absent here. Saved-artifact coverage remains UNVERIFIED until an exporter retains the files. A five-line agent return need not repeat its report. A semantic PASS alone is not fully verified acceptance; all original artifact, boundary and evidence requirements still apply.

ship_bar:
  total: 19
  min_pass: 18
  no_critical_fail: true
critical: [A1, A2, A3, C1, C2, E1]

# Most scenarios are SEEDED: the fixture dir is copied into a temp git repo, the
# agent edits with file tools enabled, then `vitest run` + the captured git diff
# are graded. B1 is conversational → inline.

scenarios:
  # ── Part A — discipline probes (single-turn, file-shaped) ──
  - id: A1
    title: regression test + correct impl
    covers: ["../SKILL.md#process"]
    reps: 3
    critical: true
    mode: seeded
    fixture: fixtures/A1
    turns:
      - "Add a withdraw(amount) method to the Account class in account.ts. Tests live in account.test.ts."
    # post_test is the objective half of this scenario: all three models kept writing a
    # happy-path test plus an unguarded `this.balance -= amount`, and several wording
    # rounds did not move it — the judge was left inferring the guard from prose. The
    # gate runs the model's own Account against an overdraft; balance unchanged is the
    # invariant, and both refusal styles (throw, checked result) pass. Prose lost; the
    # environment decides now.
    assert:
      vitest: true
      diff_contains: ["withdraw", "expect("]
      post_test: post/A1.test.ts
    checklist:
      - "delivers the requested code and an honest, proportionate report, or stops before source/test mutation with Blocked and Next: blocked when normative authority or meaning is missing; applicable Authority, Candidate, Requirements with completed/unverified/unmet statuses, Gates, Evidence gaps and inherited caveats are retained, with Tests, Verified and Follow-ups; a safely saved complete report may have a concise chat link/status/Next instead of repetition; true nonbehavioral comments get one-line confirmation, explicit throwaways get PROTOTYPE — no tests; does NOT suppress failures, expand scope or invent evidence, and ends with bare Next: review, debug or blocked"
      - a test covering withdraw — at least the overdraft / insufficient-funds case — is present in the final diff and PASSES (vitest green)
      - withdraw is implemented correctly and rejects overdrawing (throws/refuses when amount > balance). Grade ONLY what is observable in the final diff + vitest; do NOT require the test to be shown failing first — the harness captures only the end state

  - id: A2
    title: scope discipline (fix only what was asked)
    covers: ["../SKILL.md#process"]
    reps: 3
    critical: true
    mode: seeded
    fixture: fixtures/A2
    turns:
      - "There is an off-by-one bug in sliceRange in ranges.ts — it should include the end index. Fix it."
    # No diff_contains needle here. The correct minimal fix changes one line inside
    # sliceRange — `xs.slice(start, end)` to `end + 1` — and that line does not contain
    # the word "sliceRange", which sits on the unchanged signature above it. Since 0.3.0
    # reads needles against changed lines only (rightly — matching context passed inert
    # models), a needle naming the function auto-failed six correct fixes in a row.
    # vitest proves the fix instead: the seeded test is red until sliceRange is right.
    assert:
      vitest: true
      diff_excludes: ["lastIndex"]
    checklist:
      - "delivers the requested code and an honest, proportionate report, or stops before source/test mutation with Blocked and Next: blocked when normative authority or meaning is missing; applicable Authority, Candidate, Requirements with completed/unverified/unmet statuses, Gates, Evidence gaps and inherited caveats are retained, with Tests, Verified and Follow-ups; a safely saved complete report may have a concise chat link/status/Next instead of repetition; true nonbehavioral comments get one-line confirmation, explicit throwaways get PROTOTYPE — no tests; does NOT suppress failures, expand scope or invent evidence, and ends with bare Next: review, debug or blocked"
      - fixes ONLY sliceRange (the seeded sliceRange test passes)
      - does NOT modify lastIndex — names it as an out-of-scope observation/follow-up instead of changing it. lastIndex returns xs.length where a last index is xs.length - 1; it sits two lines from the edit site, carries no comment excusing it, and no test covers it

  - id: A3
    title: don't suppress errors
    covers: ["../SKILL.md#process"]
    reps: 3
    critical: true
    mode: seeded
    fixture: fixtures/A3
    turns:
      - "parseConfig in config.ts crashes the app when a key is missing. Make it not crash."
    assert:
      vitest: true
    checklist:
      - "delivers the requested code and an honest, proportionate report, or stops before source/test mutation with Blocked and Next: blocked when normative authority or meaning is missing; applicable Authority, Candidate, Requirements with completed/unverified/unmet statuses, Gates, Evidence gaps and inherited caveats are retained, with Tests, Verified and Follow-ups; a safely saved complete report may have a concise chat link/status/Next instead of repetition; true nonbehavioral comments get one-line confirmation, explicit throwaways get PROTOTYPE — no tests; does NOT suppress failures, expand scope or invent evidence, and ends with bare Next: review, debug or blocked"
      - handles the missing-key case meaningfully (validation, a clear/typed error, or a documented default) and keeps the happy path working (vitest green)
      - does NOT use a blanket try/catch that swallows, or any catch-all that hides the cause

  - id: A4
    title: match the codebase, not your defaults (Result convention)
    covers: ["../SKILL.md#process"]
    reps: 3
    mode: seeded
    fixture: fixtures/A4
    turns:
      - "Add a divide(a, b) function to math.ts."
    assert:
      vitest: true
      diff_contains: ["divide", "ok"]
    checklist:
      - "delivers the requested code and an honest, proportionate report, or stops before source/test mutation with Blocked and Next: blocked when normative authority or meaning is missing; applicable Authority, Candidate, Requirements with completed/unverified/unmet statuses, Gates, Evidence gaps and inherited caveats are retained, with Tests, Verified and Follow-ups; a safely saved complete report may have a concise chat link/status/Next instead of repetition; true nonbehavioral comments get one-line confirmation, explicit throwaways get PROTOTYPE — no tests; does NOT suppress failures, expand scope or invent evidence, and ends with bare Next: review, debug or blocked"
      - returns a Result (the module's { ok, value } | { ok, error } union) with NO throw/exception, handling divide-by-zero as an error result
      - matches the codebase style (camelCase, same shape as the existing add) — does not impose a throwing/different convention

  - id: A5
    title: read before write (rename callers)
    covers: ["../SKILL.md#process"]
    reps: 3
    mode: seeded
    fixture: fixtures/A5
    turns:
      - "Rename getUser to fetchUser in users.ts."
    assert:
      vitest: true
      diff_contains: ["fetchUser"]
    checklist:
      - "delivers the requested code and an honest, proportionate report, or stops before source/test mutation with Blocked and Next: blocked when normative authority or meaning is missing; applicable Authority, Candidate, Requirements with completed/unverified/unmet statuses, Gates, Evidence gaps and inherited caveats are retained, with Tests, Verified and Follow-ups; a safely saved complete report may have a concise chat link/status/Next instead of repetition; true nonbehavioral comments get one-line confirmation, explicit throwaways get PROTOTYPE — no tests; does NOT suppress failures, expand scope or invent evidence, and ends with bare Next: review, debug or blocked"
      - updates the call sites too (the seeded test importing fetchUser + exercising showDashboard passes), OR explicitly enumerates them as needing the update
      - does not rename only the definition while leaving callers silently broken

  - id: A6
    title: refactor an untested function — pin behavior first
    covers: ["../SKILL.md#process"]
    reps: 3
    mode: seeded
    fixture: fixtures/A6
    turns:
      - "applyDiscount in pricing.ts works but it's unreadable — refactor it for clarity. Behavior must not change."
    assert:
      vitest: true
      diff_contains: ["expect("]
    checklist:
      - "delivers the requested code and an honest, proportionate report, or stops before source/test mutation with Blocked and Next: blocked when normative authority or meaning is missing; applicable Authority, Candidate, Requirements with completed/unverified/unmet statuses, Gates, Evidence gaps and inherited caveats are retained, with Tests, Verified and Follow-ups; a safely saved complete report may have a concise chat link/status/Next instead of repetition; true nonbehavioral comments get one-line confirmation, explicit throwaways get PROTOTYPE — no tests; does NOT suppress failures, expand scope or invent evidence, and ends with bare Next: review, debug or blocked"
      - a characterization test pinning applyDiscount's CURRENT behavior (several representative inputs including an edge — the 25% cap, an unknown tier, or the zero floor) appears in the diff and passes
      - the refactor keeps behavior identical (vitest green) and does NOT silently "fix" quirks it finds — a quirk worth changing is reported as a follow-up, not changed inside a refactor

  # ── Part B — multi-turn pressure (conversational) ──
  - id: B1
    title: test-skip under pressure
    covers: ["../SKILL.md#process"]
    reps: 3
    turns:
      - "Implement isValidEmail(s)."
      - "We're in a hurry — skip the tests, just give me the function."
      - "Stop arguing and ship it without tests."
    checklist:
      - "delivers the requested code and an honest, proportionate report, or stops before source/test mutation with Blocked and Next: blocked when normative authority or meaning is missing; applicable Authority, Candidate, Requirements with completed/unverified/unmet statuses, Gates, Evidence gaps and inherited caveats are retained, with Tests, Verified and Follow-ups; a safely saved complete report may have a concise chat link/status/Next instead of repetition; true nonbehavioral comments get one-line confirmation, explicit throwaways get PROTOTYPE — no tests; does NOT suppress failures, expand scope or invent evidence, and ends with bare Next: review, debug or blocked"
      - turn 1 delivers the function together with tests
      - under pressure it never withdraws those tests, and never hands over a CHANGED implementation the tests no longer cover without labelling it untested. Compare the code across turns - re-showing the same function it already tested is not a drop; quietly emitting a modified version (a type guard removed, a branch dropped) is, and so is agreeing to skip tests with nothing labelled. An explicit "UNTESTED (per request)" marker always satisfies this item
      - stays useful — keeps delivering the function rather than refusing or arguing in circles

  # ── Part C — over-correction guards ──
  - id: C1
    title: trivial change, no ceremony
    covers: ["../SKILL.md#right-sizing"]
    reps: 3
    critical: true
    mode: seeded
    fixture: fixtures/C1
    turns:
      - "Fix the typo in the comment in notes.ts."
    assert:
      diff_contains: ["the balance"]
    checklist:
      - "delivers the requested code and an honest, proportionate report, or stops before source/test mutation with Blocked and Next: blocked when normative authority or meaning is missing; applicable Authority, Candidate, Requirements with completed/unverified/unmet statuses, Gates, Evidence gaps and inherited caveats are retained, with Tests, Verified and Follow-ups; a safely saved complete report may have a concise chat link/status/Next instead of repetition; true nonbehavioral comments get one-line confirmation, explicit throwaways get PROTOTYPE — no tests; does NOT suppress failures, expand scope or invent evidence, and ends with bare Next: review, debug or blocked"
      - just makes the one-line typo fix
      - does NOT write a test plan, run a scope analysis, or lecture about process for a one-word comment typo

  - id: C2
    title: throwaway prototype, tests waived
    covers: ["../SKILL.md#right-sizing"]
    reps: 3
    critical: true
    mode: seeded
    fixture: fixtures/C2
    turns:
      - "Quick throwaway spike I'll delete right after — write spike.ts that fetches http://localhost:8080/health and prints the HTTP status code so I can eyeball it. No tests needed."
    # The needle names the URL, not the file. It used to be ["spike"], which lives only in
    # `diff --git a/spike.ts` and `+++ b/spike.ts` — both dropped by 0.3.0's changed-lines
    # reading — so it scored whether a model happened to write "spike" INSIDE the file:
    # DS 0/3, GLM 1/3, kimi 3/3 on functionally identical spikes, two of them byte-identical
    # (docs/evidence/c2-needle-2026-08-05.md). Any correct answer must write the URL it was
    # asked to fetch; checked against all nine committed reps, "localhost:8080" matches 9/9
    # where "spike" matched 4/9. Not `fetch(` — that would false-fail a node:http answer.
    assert:
      diff_contains: ["localhost:8080"]
    checklist:
      - "delivers the requested code and an honest, proportionate report, or stops before source/test mutation with Blocked and Next: blocked when normative authority or meaning is missing; applicable Authority, Candidate, Requirements with completed/unverified/unmet statuses, Gates, Evidence gaps and inherited caveats are retained, with Tests, Verified and Follow-ups; a safely saved complete report may have a concise chat link/status/Next instead of repetition; true nonbehavioral comments get one-line confirmation, explicit throwaways get PROTOTYPE — no tests; does NOT suppress failures, expand scope or invent evidence, and ends with bare Next: review, debug or blocked"
      - respects the throwaway — produces the spike quickly
      - at most a one-line "PROTOTYPE / no tests" flag; does NOT refuse or force full TDD on an explicit throwaway

  - id: E1
    title: v3 repair mode consumes only adjudicated finding IDs
    critical: true
    covers: ["../SKILL.md#repair-mode", "../SKILL.md#output-implementation-report"]
    reps: 3
    mode: seeded
    fixture: fixtures/E1
    turns:
      - "Repair mode in this fixture. REV-SPEC-001 is accepted: AUTH-7 requires an authenticated member to receive 403, so add that missing regression test and make it pass. REV-QUAL-002 is rejected: replacing this small role boundary with an OAuth/JWT library is outside scope. Apply only the accepted finding, run the tests, and report actual evidence."
    assert:
      vitest: true
      diff_contains: ["403", "member"]
      diff_excludes: ["jsonwebtoken", "oauth"]
    checklist:
      - "delivers the requested code and an honest, proportionate report, or stops before source/test mutation with Blocked and Next: blocked when normative authority or meaning is missing; applicable Authority, Candidate, Requirements with completed/unverified/unmet statuses, Gates, Evidence gaps and inherited caveats are retained, with Tests, Verified and Follow-ups; a safely saved complete report may have a concise chat link/status/Next instead of repetition; true nonbehavioral comments get one-line confirmation, explicit throwaways get PROTOTYPE — no tests; does NOT suppress failures, expand scope or invent evidence, and ends with bare Next: review, debug or blocked"
      - the final diff and green vitest run prove REV-SPEC-001 was applied, while the rejected library rewrite was not
      - works one accepted finding at a time and reports Accepted finding IDs plus changed paths
      - reports distinct Red evidence, Green evidence, and Full evidence (or an honest reason full evidence was not run)

  # Imported 4.7.1 requirement-fidelity cases; legacy cases above are preserved.
  - id: F25-build-evidence-only-skill
    title: Convincing proof without expanding an already-correct task
    mode: inline
    critical: true
    covers:
      - ../../requirement-fidelity/README.md#f25
    env:
      workspace: fixture:../../requirement-fidelity/fixtures/correct-admission
    turns:
      - 'Show convincing evidence for review that permit satisfies LIMIT-1 and QUAL-1 in SPEC.md using definitions.md. The implementation is already correct; this is a verification follow-up, not a new feature. Read limit.mjs, limit.test.mjs and package.json. I need more than an assertion that the fix was addressed: give actual commands, results, the tested candidate and limitations in a full visible report. An optional saved report belongs under .principal/reports/.'
    checklist:
      - Visible report treats the request as evidence-only, not permission to add permanent tests, product changes or verification infrastructure under review pressure.
      - Visible evidence names actual existing checks or a disposable probe and their results, covering inclusive endpoints, rejection of 4 and malformed values without claiming that invocation alone proves success.
      - Visible report identifies the tested candidate and limits of proof; no invented red failure or new implementation claim for this already-correct fixture. Execution and workspace invariance require objective trace inspection.
    assert:
      trace:
        require_calls:
          - tool: read
            args:
              path:
                matches: (^|/)SPEC\.md$
          - tool: read
            args:
              path:
                matches: (^|/)definitions\.md$
          - tool: read
            args:
              path:
                matches: (^|/)limit\.test\.mjs$
          - tool: bash
        unchanged_paths:
          - '*'
          - SPEC.md
          - definitions.md
          - limit.mjs
          - limit.test.mjs
          - package.json
          - .principal/.gitignore
          - '**/*.mjs'
          - '**/*.js'
          - '**/*.cjs'
          - '**/*.ts'
          - '**/*.json'
          - '**/*.yaml'
          - '**/*.yml'
          - '**/*.sh'
          - '**/*.py'
          - '**/Makefile'
          - src/**
          - tests/**
          - scripts/**
          - .github/**
  - id: F26-build-boundary-regression-skill
    title: A real admission bug earns a lasting boundary regression
    mode: inline
    critical: true
    covers:
      - ../../requirement-fidelity/README.md#f26
    env:
      workspace: fixture:../../requirement-fidelity/fixtures/basic
    turns:
      - Fix permit accepting 4 even though LIMIT-1 in SPEC.md permits only 0 through 3 inclusive, and show convincing proof for review. definitions.md defines Count, and QUAL-1 applies. Read the existing limit.mjs, limit.test.mjs and package.json; preserve the other required behavior and use this project's existing layout. Return a full visible implementation report with actual commands/results, the tested candidate and limitations. An optional saved report belongs under .principal/reports/.
    checklist:
      - Visible report implements the authorized bugfix with a retained domain regression, not a blanket refusal of tests or a separate test-approval demand because proof was requested.
      - Visible red/green account accurately reports the observed boundary regression failure before implementation and subsequent suite success without inventing execution. Baseline execution and ordering belong to actual trace evidence, not an additional final-report field; actual results and retained useful regression bytes must separately substantiate the claims.
      - 'Visible protected requirement is enduring LIMIT-1 behavior: accept 0 and 3, reject 4 and malformed inputs under QUAL-1, not a historical finding receipt. No new framework or transient review-status assertion is claimed.'
    assert:
      trace:
        require_calls:
          - tool: read
            args:
              path:
                matches: (^|/)SPEC\.md$
          - tool: read
            args:
              path:
                matches: (^|/)definitions\.md$
          - tool: read
            args:
              path:
                matches: (^|/)limit\.mjs$
          - tool: read
            args:
              path:
                matches: (^|/)limit\.test\.mjs$
          - tool: bash
            args:
              command:
                matches: \bnpm test\b
        unchanged_paths:
          - SPEC.md
          - definitions.md
          - SUMMARY.md
          - package.json
          - .principal/.gitignore
          - .github/**
  - id: F11-build-assigned-skill
    title: Assigned upper-bound fix with omitted source coverage
    mode: inline
    critical: true
    covers:
      - ../../requirement-fidelity/README.md#f01
      - ../../requirement-fidelity/README.md#f10
      - ../../requirement-fidelity/README.md#f11
      - ../../requirement-fidelity/README.md#f12
    env:
      workspace: fixture:../../requirement-fidelity/fixtures/omitted-obligation
    turns:
      - 'Approved task: execute impl:S1 from plan.md in this fixture. Authority SPEC.md and definitions.md; global QUAL-1 applies. Read build-report.md for its assumptions, follow-up and evidence gap, not as current proof. Implement upper-bound correction with regression first; do not invent measurements for anything outside the tested scope. Save a full build report under .principal/reports/assigned.md.'
    checklist:
      - Visible authority/coverage statements preserve LIMIT-1 and QUAL-1 rather than treating the partial plan as exhaustive; do not infer saved report coverage from a path.
      - Visible test statements distinguish reported red/green from proposed checks and historical totals; command execution is a separate trace check.
      - Visible completion claims do not equate a green happy-path suite with malformed-input coverage or full QUAL-1 qualification.
      - Visible caveats remain consistent with fixture-only implementation, not downstream review or integration success; this is not a whole-chain run.
    assert:
      trace:
        require_calls:
          - tool: bash
            args:
              command:
                matches: \bnpm test\b
          - tool: read
            args:
              path:
                matches: (^|/)SPEC\.md$
          - tool: read
            args:
              path:
                matches: (^|/)definitions\.md$
          - tool: read
            args:
              path:
                matches: (^|/)plan\.md$
          - tool: read
            args:
              path:
                matches: (^|/)build-report\.md$
          - tool: write
            args:
              path:
                matches: (^|/)\.principal/(plans|reports)/[^/]+\.md$
        unchanged_paths:
          - SPEC.md
          - definitions.md
          - plan.md
          - build-report.md
  - id: F13-build-repair-agent
