          - tool: read
            args:
              path:
                matches: (^|/)SPEC\.md$
          - tool: read
            args:
              path:
                matches: (^|/)definitions\.md$
          - tool: read
            args:
              path:
                matches: (^|/)plan\.md$
          - tool: read
            args:
              path:
                matches: (^|/)build-report\.md$
          - tool: write
            args:
              path:
                matches: (^|/)\.principal/(plans|reports)/[^/]+\.md$
        unchanged_paths:
