  - id: F14-build-ids-only-skill
    title: IDs-only repair refuses guessed meaning
    mode: inline
    critical: true
    covers:
      - ../../requirement-fidelity/README.md#f14
    env:
      workspace: fixture:../../requirement-fidelity/fixtures/missing-source
    turns:
