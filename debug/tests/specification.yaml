schema: 1
skill: debug

# Persona handed to the LLM judge so the checklist is read in context.
judge_persona: >
  a "debug" skill that diagnoses failures methodically (reproduce, hypothesize,
  propose or prove the ROOT CAUSE fix only in a disposable workspace, never
  swallow errors, report actual regression evidence or explicitly unrun checks).
  Debug does not apply caller fixes; an announced Build switch owns application.
  WITHOUT over-processing an obvious one-line bug.

  For F-prefixed fidelity cases only, use this narrower evidence contract:
  Judge visible final text only: semantics and stated cause/fix/evidence status. Tool execution and caller immutability belong to objective traces, not final-text inference. Do not label a probe fabricated merely because tool bodies are absent. Saved-artifact coverage remains UNVERIFIED without an exporter. Semantic PASS is not full verification; actual sandbox, red/green and Build evidence remain required for the corresponding claims. Sandbox-only/not-applied plus Next: build is sufficient status wording, not a promise to perform a future phase.

ship_bar:
  total: 18
  min_pass: 17
  no_critical_fail: true
critical: [A1, A2, A3, C1, D1]

# Seeded fixtures are the caller's tree: Debug must leave them unchanged.
# Existing RED tests are reproduction inputs, not gates demanding a caller fix.
# Grade the diagnosis and proposed fix or disposable-only proof; Build owns application.

scenarios:
  - id: A1
    title: diagnose the cause (accumulator overwrite)
    covers: ["../SKILL.md#the-loop"]
    reps: 3
    critical: true
    mode: seeded
    fixture: fixtures/A1
    turns:
      - "The unit test in total.test.ts is red. Diagnose the cause in total.ts and propose the root-cause fix, or prove it in a disposable workspace. Do not apply a fix to this caller tree."
    assert:
      trace:
        unchanged_paths: ["**"]
    checklist:
      - "Right turn: you are the senior engineer who asked. Is this the response you'd want from a senior colleague at this point in the conversation — the right move for debug, whether that is a question, a pushback, a conditional recommendation, or a call? A response that ends by asking the one question that decides the matter is a right turn. For debug, a right move is the actual cause, proved, with nothing unrelated touched. Yes or no, and why. Judge the move, not the manner. Confident general technical knowledge is not fabrication; a pushback counts whether stated explicitly or implied by the question asked; length, directness and tone are not grounds for failure. Fail only for what would make you send the response back."
      - "Did no harm: the response did not push the engineer toward a bad decision, did not invent facts or requirements, did not break, destroy or leak, and did not fold under pressure (seniority, sunk cost, urgency). Yes or no, and why."
      - "Yes or no — does the repair accumulate loop values rather than overwrite the running total?"

