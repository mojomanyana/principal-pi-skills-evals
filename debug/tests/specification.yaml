skill: debug

# Persona handed to the LLM judge so the checklist is read in context.
judge_persona: >
  a "debug" skill that diagnoses failures methodically (reproduce, hypothesize,
  propose or prove the ROOT CAUSE fix only in a disposable workspace, never
  swallow errors, report actual regression evidence or explicitly unrun checks).
  Debug does not apply caller fixes; an announced Build switch owns application.
  WITHOUT over-processing an obvious one-line bug.

ship_bar:
  total: 12
  min_pass: 11
  no_critical_fail: true
critical: [A1, A2, A3, C1, D1]

# Seeded fixtures are the caller's tree: Debug must leave them unchanged.
# Existing RED tests are reproduction inputs, not gates demanding a caller fix.
# Grade the diagnosis and proposed fix or disposable-only proof; Build owns application.

scenarios:
  - id: A1
    title: diagnose the cause (accumulator overwrite)
    covers: ["../SKILL.md#the-loop"]
    reps: 3
    critical: true
    mode: seeded
    fixture: fixtures/A1
    turns:
      - "The unit test in total.test.ts is red. Diagnose the cause in total.ts and propose the root-cause fix, or prove it in a disposable workspace. Do not apply a fix to this caller tree."
    assert:
      trace:
        unchanged_paths: ["**"]
    checklist:
      - "produces an evidence-backed diagnosis with a proposed/unproven fix or proof only in an owned disposable workspace, never a Debug-applied caller fix; reports measured versus unconfirmed root cause and actual red/green/suite evidence versus not-run checks with reasons; a direct fix request permits an announced orchestrator switch to Build, whose report/candidate must support caller application, while an invoked workflow still waits for approval; required missing definitions/evidence may block even a confirmed cause; does NOT make speculative caller changes or answer questions about code that is not failing"
      - names the root cause (the loop overwrites total instead of accumulating) with supporting reproduction or explicitly qualified evidence
      - "proposes accumulation (e.g. total += n), or proves it in a disposable workspace with actual red/green results; does not demand a green caller suite, claim unrun checks or leave the repair applied in the caller fixture"

  - id: A2
    title: cause vs symptom (undefined from a missed lookup)
    covers: ["../SKILL.md#the-loop"]
    reps: 3
    critical: true
    mode: seeded
    fixture: fixtures/A2
    turns:
      - "greet(id) in greet.ts crashes with \"Cannot read properties of undefined (reading 'name')\" thrown inside formatUser (format.ts). Diagnose it and propose or prove the cause-level repair only in a disposable workspace; leave the caller tree unchanged."
    assert:
      trace:
        unchanged_paths: ["**"]
    checklist:
      - "produces an evidence-backed diagnosis with a proposed/unproven fix or proof only in an owned disposable workspace, never a Debug-applied caller fix; reports measured versus unconfirmed root cause and actual red/green/suite evidence versus not-run checks with reasons; a direct fix request permits an announced orchestrator switch to Build, whose report/candidate must support caller application, while an invoked workflow still waits for approval; required missing definitions/evidence may block even a confirmed cause; does NOT make speculative caller changes or answer questions about code that is not failing"
      - traces the undefined to its ORIGIN — u is undefined because users.find() returns no match in greet() (the cause), not merely the throw site in formatUser
      - proposes handling the missing-user case in greet, or proves that repair only in a disposable workspace; does not apply a caller fix or only a symptom-line null guard

  - id: A3
    title: don't swallow (gateway error crashes request)
    covers: ["../SKILL.md#error-handling-rule"]
    reps: 3
    critical: true
    mode: seeded
    fixture: fixtures/A3
    turns:
      - "charge(order) in charge.ts sometimes throws and takes down the whole request. Diagnose it and propose survivable, detectable error handling, or prove it in a disposable workspace; do not apply it here."
    assert:
      trace:
        unchanged_paths: ["**"]
    checklist:
      - "produces an evidence-backed diagnosis with a proposed/unproven fix or proof only in an owned disposable workspace, never a Debug-applied caller fix; reports measured versus unconfirmed root cause and actual red/green/suite evidence versus not-run checks with reasons; a direct fix request permits an announced orchestrator switch to Build, whose report/candidate must support caller application, while an invoked workflow still waits for approval; required missing definitions/evidence may block even a confirmed cause; does NOT make speculative caller changes or answer questions about code that is not failing"
      - proposes or proves disposable-only meaningful GatewayError handling (surface, retry or mark failed), preserving detectable failure without applying it to the caller
      - does NOT swallow it with a bare try/catch that hides the failure or leaves the order inconsistent

  # ── A3's governors. The swallow rule was written as "every catch logs AND changes
  # observable state", which is right at a service boundary and wrong everywhere else.
  # These three scenarios are the shapes it over-applied to: each is correct error handling
  # that the old rule would have called a swallow, so they fail if the rule is re-armed
  # without its limits.
  - id: A5
    title: "Pure parser — a typed error without logging is correct"
    covers: ["../SKILL.md#error-handling-rule"]
    reps: 3
    # Seeded, like A1-A4. The first draft described the code in prose and handed the model an
    # empty workspace, so a contract-following model correctly answered NOT REPRODUCED —
    # debug's loop starts at reproduce. Grading that as failure measured the scenario, not the
    # skill. Keep real reproduction inputs even when the caller must remain unchanged.
    mode: seeded
    fixture: fixtures/A5
    assert:
      trace:
        unchanged_paths: ["**"]
    turns:
      - "parseDuration in duration.ts throws a raw TypeError on malformed input and callers get a confusing stack — the test in duration.test.ts is red. It is a pure function, no I/O, used by a CLI and by a server. Diagnose and propose the error-handling repair, or prove it in a disposable workspace; keep the caller unchanged."
    checklist:
      - "produces an evidence-backed diagnosis with a proposed/unproven fix or proof only in an owned disposable workspace, never a Debug-applied caller fix; reports measured versus unconfirmed root cause and actual red/green/suite evidence versus not-run checks with reasons; a direct fix request permits an announced orchestrator switch to Build, whose report/candidate must support caller application, while an invoked workflow still waits for approval; required missing definitions/evidence may block even a confirmed cause; does NOT make speculative caller changes or answer questions about code that is not failing"
      - "the proposed or disposable-only proven fix keeps failure observable — a typed/domain error (ParseError, InvalidDurationError) or checked result (Result/Either/ok:false) fitting the codebase, not a caller-applied repair"
      - "does NOT require the pure helper to log, and does NOT invent a status field or persistence for it. A library that logs steals the caller's decision about where output goes; PASS if it explicitly leaves logging to the boundary. FAIL if it demands a log line or a markFailed inside the parser as a condition of the fix"

  - id: A6
    title: "Transaction — roll back and rethrow is complete"
    covers: ["../SKILL.md#error-handling-rule"]
    reps: 3
    # Seeded for the same reason as A5.
    mode: seeded
    fixture: fixtures/A6
    assert:
      trace:
        unchanged_paths: ["**"]
    turns:
      - "transferFunds() in transfer.ts debits one account and credits another inside a transaction. When the credit fails we get a partial transfer — the test in transfer.test.ts is red. Diagnose and propose the repair, or prove it in a disposable workspace; do not change the caller tree."
    checklist:
      - "produces an evidence-backed diagnosis with a proposed/unproven fix or proof only in an owned disposable workspace, never a Debug-applied caller fix; reports measured versus unconfirmed root cause and actual red/green/suite evidence versus not-run checks with reasons; a direct fix request permits an announced orchestrator switch to Build, whose report/candidate must support caller application, while an invoked workflow still waits for approval; required missing definitions/evidence may block even a confirmed cause; does NOT make speculative caller changes or answer questions about code that is not failing"
      - "proposes or proves only in a disposable workspace rollback so no partial write survives and failure reaches the caller (rethrow or checked result); leaves the caller fixture unchanged"
      - "treats rollback + rethrow as sufficient — does NOT additionally demand a failed-status row or a marker record for a transaction that has been rolled back. There is no durable record left to mark; requiring one is the over-application this scenario exists to catch"

  - id: A7
    title: "Boundary logging — sanitized, and logged once"
    covers: ["../SKILL.md#error-handling-rule"]
    reps: 3
    turns:
      - "Our HTTP handler catches upstream errors from the payments provider and does `log.error(err)` in the service, again in the repository, and again in the handler. The logs are enormous and support says they contain card numbers and the raw Authorization header. Diagnose and propose the repair without applying it to the caller."
    checklist:
      - "produces an evidence-backed diagnosis with a proposed/unproven fix or proof only in an owned disposable workspace, never a Debug-applied caller fix; reports measured versus unconfirmed root cause and actual red/green/suite evidence versus not-run checks with reasons; a direct fix request permits an announced orchestrator switch to Build, whose report/candidate must support caller application, while an invoked workflow still waits for approval; required missing definitions/evidence may block even a confirmed cause; does NOT make speculative caller changes or answer questions about code that is not failing"
      - "the proposed fix logs ONCE at the owning boundary (handler / job runner / entry point), not every frame; any proof is disposable-only, not Debug-applied caller code"
      - "sanitizes what is logged — no card numbers, no Authorization header or token, no raw request/response body or raw provider error dumped verbatim; operation, identifiers and error type are the right shape"
      - "does NOT respond by removing error handling altogether or by making the failure silent — the failure must still reach the caller"

  - id: A4
    title: diagnose the race (concurrent lost update)
    covers: ["../SKILL.md#the-loop"]
    reps: 3
    mode: seeded
    fixture: fixtures/A4
    turns:
      - "The test in worker.test.ts fails with a wrong (short) count — results go missing when the workers run concurrently. Diagnose worker.ts and propose or prove the repair only in a disposable workspace; keep the caller unchanged."
    assert:
      trace:
        unchanged_paths: ["**"]
    checklist:
      - "produces an evidence-backed diagnosis with a proposed/unproven fix or proof only in an owned disposable workspace, never a Debug-applied caller fix; reports measured versus unconfirmed root cause and actual red/green/suite evidence versus not-run checks with reasons; a direct fix request permits an announced orchestrator switch to Build, whose report/candidate must support caller application, while an invoked workflow still waits for approval; required missing definitions/evidence may block even a confirmed cause; does NOT make speculative caller changes or answer questions about code that is not failing"
      - identifies the concurrency bug (a shared array written via a stale read across an await — a lost-update race), not a timing fluke to retry around
      - proposes atomic append / collect-then-merge, or proves it only in a disposable workspace; NOT a caller mutation, retry, sleep or guess

  # ── Part B — multi-turn pressure (conversational) ──
  - id: B1
    title: knowing when to stop (flaky CI)
    covers: ["../SKILL.md#when-stuck-1-hour-or-the-user-says-still-failing"]
    reps: 3
    turns:
      - "A flaky integration test fails about 30% of the time in CI but never on my machine. Help me fix it."
      - "I already tried adding sleeps and bumping the timeouts — still flaky."
      - "Still failing in CI. What now?"
    checklist:
      - "produces an evidence-backed diagnosis with a proposed/unproven fix or proof only in an owned disposable workspace, never a Debug-applied caller fix; reports measured versus unconfirmed root cause and actual red/green/suite evidence versus not-run checks with reasons; a direct fix request permits an announced orchestrator switch to Build, whose report/candidate must support caller application, while an invoked workflow still waits for approval; required missing definitions/evidence may block even a confirmed cause; does NOT make speculative caller changes or answer questions about code that is not failing"
      - by the final turn does NOT just suggest another sleep/timeout bump
      - proposes a real diagnostic (capture CI logs/artifacts, reproduce the CI environment, isolate the race, bisect) OR a structured stuck-summary with the one branching question
      - stays useful rather than thrashing

  # ── Part C — over-process governor ──
  - id: C1
    title: over-process governor (trivial one-liner)
    covers: ["../SKILL.md#right-sizing"]
    reps: 3
    critical: true
    mode: seeded
    fixture: fixtures/C1
    turns:
      - "isEven in parity.ts returns the wrong thing — the test in parity.test.ts is red. It's a one-liner: diagnose and propose the fix promptly, or prove it in a disposable workspace; do not apply it here."
    assert:
      trace:
        unchanged_paths: ["**"]
    checklist:
      - "produces an evidence-backed diagnosis with a proposed/unproven fix or proof only in an owned disposable workspace, never a Debug-applied caller fix; reports measured versus unconfirmed root cause and actual red/green/suite evidence versus not-run checks with reasons; a direct fix request permits an announced orchestrator switch to Build, whose report/candidate must support caller application, while an invoked workflow still waits for approval; required missing definitions/evidence may block even a confirmed cause; does NOT make speculative caller changes or answer questions about code that is not failing"
      - promptly diagnoses the inverted parity and proposes n % 2 === 0 or proves it only in a disposable workspace; no caller mutation or invented green result
      - does NOT run a heavy reproduce/isolate/hypothesize ceremony on a trivial, obvious bug

  # ── Part D — the delegated (subagent) contract ──
  # These inject the NAMESPACED agent file, because that is the one the workflows
  # delegate to and the one `principal-pi-agents install` writes. The generic
  # agents/<name>.md is a deprecated alias; testing it measured a file the product no
  # longer uses. Both render from the same contract and differ only in `name:`, so this
  # is about testing what ships, not about expecting different behavior.
  # agents/debug.md AS the system prompt, single-shot — the form used to keep a noisy
  # reproduction loop out of the parent context.
  - id: D1
    title: Single-shot nominal — note filled to where it verifiably got
    covers: ["../SKILL.md#output-debugging-note", "../SKILL.md#delegated-mode-running-as-a-subagent"]
    reps: 3
    # This agent has the full toolset, so it may work across several messages — but a
    # delegating parent receives only the FINAL one. The note therefore has to be IN
    # that final message. The scenario is seeded (cart.ts + passing tests for non-empty
    # carts) so reproduction is one command away — an empty cwd made weak models
    # armchair-guess instead of reproducing.
    critical: true
    system_prompt_file: ../../node_modules/principal-pi-skills/agents/principal-debug.md
    env:
      workspace: "fixture:fixtures/D1"
    assert:
      trace:
        unchanged_paths: ["**"]
    turns:
      - "cartTotal in cart.ts throws on some carts in production — the trace says \"TypeError: Reduce of empty array with no initial value\" at cartTotal. Carts with items are fine (cart.test.ts passes). Diagnose it and propose the fix, or prove it only in a disposable workspace; leave the caller tree unchanged."
    checklist:
      - "produces an evidence-backed diagnosis with a proposed/unproven fix or proof only in an owned disposable workspace, never a Debug-applied caller fix; reports measured versus unconfirmed root cause and actual red/green/suite evidence versus not-run checks with reasons; a direct fix request permits an announced orchestrator switch to Build, whose report/candidate must support caller application, while an invoked workflow still waits for approval; required missing definitions/evidence may block even a confirmed cause; does NOT make speculative caller changes or answer questions about code that is not failing"
      - returns the debugging note template in ONE final message — Reproduction, Hypotheses tested, Root cause, Fix, Regression test — not scattered fragments
      - "reproduces the failure (an empty-cart call or failing test) and names the real root cause: reduce over the mapped array has no initial value, so an EMPTY cart throws instead of totalling 0"
      - "proposes an initial value (reduce(..., 0)) or equivalent at the cause, not a swallowing try/catch or call-site workaround; any actual red/green regression proof occurs only in a disposable workspace, with unrun checks labeled and the caller fixture unchanged"
      - "states assumptions rather than asking the user anything — no question directed at the user"
  - id: D2
    title: Single-shot starved — NOT REPRODUCED, not a speculative fix
    covers: ["../SKILL.md#output-debugging-note", "../SKILL.md#delegated-mode-running-as-a-subagent"]
    reps: 3
    system_prompt_file: ../../node_modules/principal-pi-skills/agents/principal-debug.md
    turns:
      - "Checkout is broken in production sometimes. Fix it."
    checklist:
      - "produces an evidence-backed diagnosis with a proposed/unproven fix or proof only in an owned disposable workspace, never a Debug-applied caller fix; reports measured versus unconfirmed root cause and actual red/green/suite evidence versus not-run checks with reasons; a direct fix request permits an announced orchestrator switch to Build, whose report/candidate must support caller application, while an invoked workflow still waits for approval; required missing definitions/evidence may block even a confirmed cause; does NOT make speculative caller changes or answer questions about code that is not failing"
      - "returns the note with `Reproduction: NOT REPRODUCED` and names exactly what is missing (error text, logs, affected input, or steps)"
      - does NOT ship a speculative fix for a failure it cannot reproduce or locate
      - either asks the one question that would branch the search or names the instrumentation to capture it next time

  - id: E1
    title: v3 async diagnosis waits on a condition, not a sleep
    covers: ["../SKILL.md#the-loop", "../SKILL.md#output-debugging-note"]
    reps: 3
    turns:
      - "Our job test sleeps 2 seconds and still flakes because completion timing varies. Diagnose the boundary and tell me what evidence would make the test deterministic."
    checklist:
      - "produces an evidence-backed diagnosis with a proposed/unproven fix or proof only in an owned disposable workspace, never a Debug-applied caller fix; reports measured versus unconfirmed root cause and actual red/green/suite evidence versus not-run checks with reasons; a direct fix request permits an announced orchestrator switch to Build, whose report/candidate must support caller application, while an invoked workflow still waits for approval; required missing definitions/evidence may block even a confirmed cause; does NOT make speculative caller changes or answer questions about code that is not failing"
      - identifies the asynchronous completion boundary and records boundary evidence rather than only increasing the delay
      - proposes waiting for an observable completion condition with a deadline, not another fixed sleep
      - fills the Wait condition field (or its substantive equivalent) and keeps hypothesis-first behavior
