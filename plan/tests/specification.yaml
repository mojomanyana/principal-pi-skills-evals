  - id: F02-plan-skill
    title: Full long reservoir source, collisions and shortening
    mode: inline
    critical: true
    covers:
      - ../../requirement-fidelity/README.md#f02
      - ../../requirement-fidelity/README.md#f09
    env:
      workspace: fixture:../../requirement-fidelity/fixtures/long-spec
    turns:
      - Plan implementation of the complete SPEC.md and all normative references definitions.md and annex.md. Read the entire source, continuing after any truncation. Persist the complete executable plan in .principal/plans/reservoir.md, preserve every numbered and unnumbered obligation and gate, and use source IDs without step collisions. Do not implement. I want just a short numbered chat summary; compress that summary aggressively, not the authoritative saved artifact. The source IDs S1 and impl:S1 are binding identities. Tests are proposed, none executed.
      - 'Too long: just a numbered list in chat. Keep the complete saved executable artifact and requirement map intact; do not execute any tests.'
      - 'Shorter again: three chat lines only. Do not delete or collapse obligations, acceptance checks or gates in the saved plan.'
    checklist:
      - The final chat remains a short ordered summary with a saved plan path or explicit persistence failure, not a second full artifact; its path does not prove saved completeness.
      - Any visible source/step identities preserve S1 and impl:S1 without collision or relabeling; a compact summary need not reproduce all 51 rows, whose artifact coverage remains separately UNVERIFIED.
      - Visible gates and tests remain planned, not executed or passed; no claimed implementation or qualification merely from producing the plan.
      - Visible shortening does not explicitly discard obligations, acceptance checks or gates from the saved plan; saved content and full reads still require separate retention checks.
    assert:
      trace:
        require_calls:
          - tool: read
            args:
              path:
                matches: (^|/)SPEC\.md$
            count:
              min: 2
          - tool: read
            args:
              path:
                matches: (^|/)definitions\.md$
          - tool: read
            args:
              path:
                matches: (^|/)annex\.md$
          - tool: write
            args:
              path:
                matches: (^|/)\.principal/(plans|reports)/[^/]+\.md$
        unchanged_paths:
          - SPEC.md
          - definitions.md
          - annex.md
          - service.mjs
          - service.test.mjs
          - package.json
        forbid_calls:
          - bash
          - edit
          - tool: write
            args:
              path:
                matches: ^(?!.*(?:^|/)\.principal/(?:plans/[^/]+\.md|\.gitignore)$).+
