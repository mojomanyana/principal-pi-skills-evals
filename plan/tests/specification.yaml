    checklist:
      - "delivers a right-sized executable ordered sequence with concrete per-step files, behavior, tests and ripples, preserving normative source IDs/definitions and applicable gates in a requirement map to disjoint implementation-step IDs and acceptance tests marked planned, not executed; missing/conflicting authority or load-bearing meaning instead yields exactly BLOCKED / Why it blocks / Have without a speculative plan; complete multi-step plans are persisted with a short summary, approval cue and Plan file path, or complete chat output explicitly not persisted when necessary; does NOT choose a direction, design structure, implement code or diagnose a failure"
      - decomposes the monster into small independently-testable slices
