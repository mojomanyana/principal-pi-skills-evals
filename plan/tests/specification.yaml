skill: plan

# Persona handed to the LLM judge so the checklist is read in context.
judge_persona: >
  a "plan" skill that turns a task into an executable plan: outcome-first (not a
  feature list), a walking skeleton before depth, risks-and-spikes before tasks,
  small vertical independently-testable slices ordered by dependency (not a bare
  flat list), observable acceptance per step, one-way-door guardrails with
  rollback notes; WITHOUT over-planning a trivial or small reversible task. The
  skill defers a full master plan to a real planning pass, so its absence in a
  single turn is NOT a failure unless the checklist asks for it.

ship_bar:
  total: 13
  min_pass: 11
  no_critical_fail: true
critical: [A1, A2, A5, B1, C1, C2, D1, E1]

scenarios:
  # ── Part A — discipline probes (single-turn) ──
  - id: A1
    title: outcome before features
    covers: ["../SKILL.md#process"]
    reps: 3
    critical: true
    turns:
      - "Here's what we need to build: a password-reset endpoint, an email-sending service, a token store, and a rate limiter. Plan it out for me."
    checklist:
      - delivers a right-sized ordered sequence of implementation work with concrete per-step specs (files, behavior, tests, and ripples where applicable) as its output, rather than a choice, a system-structure design, implementation code, or a diagnosis
      - reframes the feature list to the measurable OUTCOME (e.g. users recover access without contacting support) before sequencing
      - does NOT just turn the feature list into ordered tasks with no outcome

  - id: A2
    title: walking skeleton first
    covers: ["../SKILL.md#process"]
    reps: 3
    critical: true
    turns:
      - "Plan the build for a new webhook ingestion service: it receives events from a vendor, validates them, transforms them, writes to our DB, and notifies downstream consumers. How should I sequence the work?"
    checklist:
      - delivers a right-sized ordered sequence of implementation work with concrete per-step specs (files, behavior, tests, and ripples where applicable) as its output, rather than a choice, a system-structure design, implementation code, or a diagnosis
      - step 1 is a thin END-TO-END walking skeleton that exercises every seam named (ingest -> validate -> transform -> DB -> notify)
      - "every named seam is PRESENT and executes in step 1. The simplest real version of a seam counts — a write of one hardcoded field, a validation of one rule, an identity/passthrough transform, a notify that posts a minimal payload. The contract's own words are `primitive, not fake`, so do not fail a seam for being trivial. FAIL only when a seam is ABSENT or BYPASSED: no notify step at all, `return true` substituted for the validation call, or logging in place of the DB write. If in doubt about a trivial-but-present seam, it PASSES — this item exists to catch missing seams, not thin ones"
      - does NOT plan horizontal layers (all models, then all services, then all wiring) that defer integration to the end

  - id: A3
    title: risks/spikes before tasks
    covers: ["../SKILL.md#process"]
    reps: 3
    turns:
      - "Plan our integration with a new payments vendor, FooPay — we've never used their API before. Lay out the work."
    checklist:
      - delivers a right-sized ordered sequence of implementation work with concrete per-step specs (files, behavior, tests, and ripples where applicable) as its output, rather than a choice, a system-structure design, implementation code, or a diagnosis
      - surfaces the risk/unknown (a never-used vendor API) and SPIKES it — a time-boxed investigation with a deliverable — before committing dependent scope
      - does not dive into a task list as if the unknown were known

  - id: A4
    title: dependency structure, not a flat list
    covers: ["../SKILL.md#process"]
    reps: 3
    turns:
      - "Just give me a numbered checklist of tasks to add user avatars to our app."
    checklist:
      - delivers a right-sized ordered sequence of implementation work with concrete per-step specs (files, behavior, tests, and ripples where applicable) as its output, rather than a choice, a system-structure design, implementation code, or a diagnosis
      - delivers the requested compressed numbered plan now as ordered vertical slices, each with a concrete done-signal
      - does NOT merely push back or hand over a bare feature list; explicit dependency or parallel annotations are not required if the response validly uses the small-clear-work form

  - id: A5
    title: one-way door gets guardrails
    covers: ["../SKILL.md#process"]
    reps: 3
    critical: true
    turns:
      - "Plan the migration of our users table to a new schema: we're splitting the full-name column into first_name and last_name and dropping the old column. Give me the steps."
    checklist:
      - delivers a right-sized ordered sequence of implementation work with concrete per-step specs (files, behavior, tests, and ripples where applicable) as its output, rather than a choice, a system-structure design, implementation code, or a diagnosis
      - flags the column-drop schema migration as a one-way / hard-to-reverse door
      - "includes a rollback plan and a verification/backup step BEFORE the destructive drop (e.g. expand-and-contract — add columns, backfill, verify, only then drop) — not just a straight-line sequence of migration steps"
      - "names a kill criterion for the destructive step — the observable pre-drop condition that ABORTS the migration (e.g. any row whose first_name + last_name fails to round-trip the old full_name) — not only a rollback for after it goes wrong"

  - id: A6
    title: observable acceptance
    covers: ["../SKILL.md#process"]
    reps: 3
    turns:
      - "Plan adding a search feature to our docs site. Just tell me the steps so I know when each is done."
    checklist:
      - delivers a right-sized ordered sequence of implementation work with concrete per-step specs (files, behavior, tests, and ripples where applicable) as its output, rather than a choice, a system-structure design, implementation code, or a diagnosis
      - insists on OBSERVABLE acceptance criteria per slice (e.g. 'returns results matching query X; integration test green')
      - does NOT accept 'implement search / build it' as the done-signal

  - id: A7
    title: decompose the monster
    covers: ["../SKILL.md#process"]
    reps: 3
    turns:
      - "This is a small feature, just plan it as one step: build the entire notifications system — in-app, email, SMS, per-user preferences, and a daily digest."
    checklist:
      - delivers a right-sized ordered sequence of implementation work with concrete per-step specs (files, behavior, tests, and ripples where applicable) as its output, rather than a choice, a system-structure design, implementation code, or a diagnosis
      - decomposes the monster into small independently-testable slices
      - explains the cost of one-giant-step (breaks parallel work, hides risk, has no honest acceptance) — does NOT accept planning the whole notifications system as a single step

  # ── Part B — multi-turn pressure ──
  - id: B1
    title: hold under "just give me the list"
    covers: ["../SKILL.md#just-give-me-the-list-compress-never-de-structure"]
    reps: 3
    critical: true
    turns:
      - "Plan how we'd add multi-tenancy to our currently single-tenant app."
      - "I don't need risks or skeletons — just give me the task list."
      - "Stop overthinking it. A numbered list, now."
    checklist:
      - delivers a right-sized ordered sequence of implementation work with concrete per-step specs (files, behavior, tests, and ripples where applicable) as its output, rather than a choice, a system-structure design, implementation code, or a diagnosis
      - holds across the turns — still delivers a real plan (vertical slices plus at least the walking skeleton or the risks, OR a deliberately right-sized plan), not a bare flat numbered task list
      - does NOT collapse to a basis-free 1-2-3 list under pressure
      - stays useful — gives something actionable, does not just refuse

  # ── Part C — over-correction guards ──
  - id: C1
    title: trivial task — don't over-plan
    covers: ["../SKILL.md#right-sizing"]
    reps: 3
    critical: true
    turns:
      - "I need to bump a config timeout from 30s to 60s in one file. Plan it for me."
    checklist:
      - delivers a right-sized ordered sequence of implementation work with concrete per-step specs (files, behavior, tests, and ripples where applicable) as its output, rather than a choice, a system-structure design, implementation code, or a diagnosis
      - "right-sizes: just says make the one-line change (it is a two-way door)"
      - does NOT impose a walking skeleton, dependency graph, or risk register on a trivial one-line reversible config edit

  - id: C2
    title: small clear feature — right-size
    covers: ["../SKILL.md#right-sizing"]
    reps: 3
    critical: true
    turns:
      - "Add a --verbose flag to our CLI that prints debug logs. Plan it."
    checklist:
      - delivers a right-sized ordered sequence of implementation work with concrete per-step specs (files, behavior, tests, and ripples where applicable) as its output, rather than a choice, a system-structure design, implementation code, or a diagnosis
      - right-sizes to a short plan — a slice or two with acceptance criteria
      - does NOT invoke the heavy machinery (spikes, a full dependency graph, observability SLOs) for a tiny reversible CLI flag

  # ── Part D — the delegated (subagent) contract ──
  # These run the installed plan/SKILL.md directly as the system prompt in a fresh
  # single-shot session, exercising its current delegated-mode assumptions contract.
  - id: D1
    title: Single-shot nominal — full plan, assumptions not questions
    covers: ["../SKILL.md#output-plan", "../SKILL.md#delegated-mode-running-as-a-subagent"]
    reps: 3
    critical: true
    system_prompt_file: ../../node_modules/principal-pi-skills/plan/SKILL.md
    turns:
      - "Add per-API-key rate limiting to our public Express API: 100 requests per minute per key, reject with 429 and a Retry-After header, counters in the Redis we already run. Tests are Vitest under test/. Plan it."
    checklist:
      - delivers a right-sized ordered sequence of implementation work with concrete per-step specs (files, behavior, tests, and ripples where applicable) as its output, rather than a choice, a system-structure design, implementation code, or a diagnosis
      - returns a complete plan in ONE response with outcome, authority, out of scope, conventions, risks, numbered steps containing Files / Change / Test / Ripples, Parallel-safe, and Assumptions
      - step 1 is a real walking skeleton touching every named seam — API-key identification, Redis counting and enforcement, and the 429 response with Retry-After — not a horizontal layer
      - records what it could not confirm under Assumptions rather than asking — no question directed at the user anywhere in the reply
      - "includes `Next: build` inside the plan; when a relevant repository exists, persists the plan verbatim and ends with `Plan file: <path>`, otherwise delivers it in chat only"
  - id: D2
    title: Single-shot starved — assumptions and best-effort plan
    covers: ["../SKILL.md#output-plan", "../SKILL.md#delegated-mode-running-as-a-subagent"]
    reps: 3
    system_prompt_file: ../../node_modules/principal-pi-skills/plan/SKILL.md
    turns:
      - "Plan the migration."
    checklist:
      - delivers a right-sized ordered sequence of implementation work with concrete per-step specs (files, behavior, tests, and ripples where applicable) as its output, rather than a choice, a system-structure design, implementation code, or a diagnosis
      - states its assumptions explicitly and produces a best-effort plan rather than returning BLOCKED or asking the user a question
      - puts a time-boxed discovery spike with a concrete deliverable before dependent migration work
      - does NOT fabricate source, target, or repository facts; uncertain details remain explicit assumptions

  - id: E1
    title: Owner-only export authorization gets executable per-step specs
    covers: ["../SKILL.md#output-plan"]
    reps: 3
    critical: true
    turns:
      - "Plan adding authorization checks to the admin export endpoint. Requirement AUTH-7 says only organization owners may export. Tests use node:test. src/auth/** is the critical scope."
    checklist:
      - delivers a right-sized ordered sequence of implementation work with concrete per-step specs (files, behavior, tests, and ripples where applicable) as its output, rather than a choice, a system-structure design, implementation code, or a diagnosis
      - states Authority grounded in AUTH-7, Out of scope, Conventions observed, Risks, and Assumptions
      - "provides ordered vertical Steps, each with Files, Change, Test including the node:test command and owner/non-owner edge cases, and Ripples; also provides Parallel-safe and `Next: build`"
      - "when a relevant repository exists, persists the multi-step plan verbatim and ends with `Plan file: <path>`; otherwise delivers it in chat only"
