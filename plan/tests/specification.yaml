      - Retain LIMIT-1, definition Count and QUAL-1 with planned boundary acceptance and no claim implementation or tests have executed; preserve existing ignore bytes.
      - If a plan is persisted, its complete content needs separate retained-artifact inspection; chat path alone does not prove completeness.
    assert:
      trace:
