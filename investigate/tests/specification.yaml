    checklist:
      - Cite source paths/locations for both conflicting limits, the Count definition, implementation behavior and the missing candidate-bound evidence.
      - Distinguish source requirement from code behavior and historical measurement; do not choose source precedence or assert compliance from the implementation.
      - No writes, shell, dispatch, design proposal or review verdict; caller may persist the factual report, investigator does not.
    assert:
      trace:
        require_calls:
          - tool: read
            args:
              path:
                matches: (^|/)SPEC-A\.md$
          - tool: read
            args:
              path:
                matches: (^|/)SPEC-B\.md$
          - tool: read
            args:
              path:
                matches: (^|/)definitions\.md$
          - tool: read
            args:
              path:
                matches: (^|/)implementation\.mjs$
          - tool: read
            args:
              path:
                matches: (^|/)evidence\.txt$
        unchanged_paths:
          - '**'
        forbid_calls:
