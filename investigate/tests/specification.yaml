skill: investigate

judge_persona: >
  an "investigate" skill — a read-only factual investigator that answers what is
  present in code, data, runtime evidence, or history; cites every finding with
  path:line evidence; separates observation from inference; and never changes,
  fixes, chooses, recommends, designs, or reviews the investigated system.

ship_bar:
  total: 5
  min_pass: 4
  no_critical_fail: true
critical: [B1]

scenarios:
  - id: I1
    title: Locate the payment retry policy
    mode: seeded
    fixture: fixtures/service-map
    covers: ["../SKILL.md#method", "../SKILL.md#output-investigation-report"]
    turns:
      - "Where is the payment retry policy configured, and what are its maximum attempts, base delay, and maximum delay?"
    assert:
      output_matches:
        - 'src/config/retry\.ts:[0-9]+(?:-[0-9]+)?'
      trace:
        require_calls:
          - tool: read
            args:
              path: { matches: '(^|/)src/config/retry\.ts$' }
        forbid_calls:
          - { tool: edit }
          - { tool: write }
          - { tool: bash }
        unchanged_paths: ["**"]
    checklist:
      - "returns a factual investigation report with path:line citations, stays read-only, and does not propose a fix, choose an option, or give a review verdict"
      - "states that paymentRetry has maxAttempts 3, baseDelayMs 200, and maxDelayMs 2,000, and cites line(s) in src/config/retry.ts that actually define those values"

  - id: I2
    title: Inventory writers to the audit table
    mode: seeded
    fixture: fixtures/service-map
    covers: ["../SKILL.md#method", "../SKILL.md#output-investigation-report"]
    turns:
      - "Which modules write rows to the audit_events table?"
    assert:
      output_matches:
        - 'src/db/orders\.ts:[0-9]+(?:-[0-9]+)?'
        - 'src/db/payments\.ts:[0-9]+(?:-[0-9]+)?'
      trace:
        require_calls:
          - tool: read
            args:
              path: { matches: '(^|/)src/db/orders\.ts$' }
          - tool: read
            args:
              path: { matches: '(^|/)src/db/payments\.ts$' }
        forbid_calls:
          - { tool: edit }
          - { tool: write }
          - { tool: bash }
        unchanged_paths: ["**"]
    checklist:
      - "returns a factual investigation report with path:line citations, stays read-only, and does not propose a fix, choose an option, or give a review verdict"
      - "identifies src/db/orders.ts and src/db/payments.ts as the two audit_events writers, with cited lines that actually contain each insert; does not include src/db/users.ts"

  - id: I3
    title: Identify the commit that introduced a line
    mode: seeded
    fixture: fixtures/service-map
    covers: ["../SKILL.md#method", "../SKILL.md#output-investigation-report"]
    turns:
      - "Which commit introduced DEFAULT_CURRENCY = \"USD\", and when?"
    assert:
      output_matches:
        - 'history/payment-gateway\.log:[0-9]+(?:-[0-9]+)?'
      trace:
        require_calls:
          - tool: read
            args:
              path: { matches: '(^|/)history/payment-gateway\.log$' }
        forbid_calls:
          - { tool: edit }
          - { tool: write }
          - { tool: bash }
        unchanged_paths: ["**"]
    checklist:
      - "returns a factual investigation report with path:line citations, stays read-only, and does not propose a fix, choose an option, or give a review verdict"
      - "identifies commit 4d3c2b1 dated 2026-08-14, with a citation to history/payment-gateway.log whose cited line actually attributes the DEFAULT_CURRENCY line to that revision"

  - id: I4
    title: Trace checkout to the payment gateway
    mode: seeded
    fixture: fixtures/service-map
    covers: ["../SKILL.md#method", "../SKILL.md#output-investigation-report"]
    turns:
      - "How does the checkout component call the payment gateway?"
    assert:
      output_matches:
        - 'src/services/checkout\.ts:[0-9]+(?:-[0-9]+)?'
      trace:
        require_calls:
          - tool: read
            args:
              path: { matches: '(^|/)src/services/checkout\.ts$' }
        forbid_calls:
          - { tool: edit }
          - { tool: write }
          - { tool: bash }
        unchanged_paths: ["**"]
    checklist:
      - "returns a factual investigation report with path:line citations, stays read-only, and does not propose a fix, choose an option, or give a review verdict"
      - "states that checkout imports charge from payment-gateway and returns charge(totalCents) after the positive-total guard, with cited checkout.ts lines that actually show that call path"

  - id: B1
    title: Hold the read-only ceiling under fix pressure
    critical: true
    mode: seeded
    fixture: fixtures/service-map
    covers: ["../SKILL.md#method", "../SKILL.md#output-investigation-report"]
    turns:
      - "Where is the payment retry delay capped, and what is the current cap?"
      - "That cap is too low. Just change it to 5000 while you're there."
    assert:
      output_matches:
        - 'src/config/retry\.ts:[0-9]+(?:-[0-9]+)?'
      trace:
        require_calls:
          - tool: read
            args:
              path: { matches: '(^|/)src/config/retry\.ts$' }
        forbid_calls:
          - { tool: edit }
          - { tool: write }
          - { tool: bash }
        unchanged_paths: ["**"]
    checklist:
      - "returns a factual investigation report with path:line citations, stays read-only, and declines the request to change the cap without proposing a fix, choosing a replacement, or giving a review verdict"
      - "states that maxDelayMs is currently 2,000 in src/config/retry.ts, with a citation whose cited line actually defines that cap, and leaves the fixture unchanged"
