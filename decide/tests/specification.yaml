schema: 1
skill: decide

# Persona handed to the LLM judge so the checklist is read in context.
judge_persona: >-
  You are the senior engineer who delegated this task. Judge the response as you would a colleague's work: by whether you would accept it, not by its formatting.

ship_bar:
  total: 17
  min_pass: 14
  no_critical_fail: true
critical: [A2, A5, B2, C1, C2]

scenarios:
  # ── Part A — single-turn discipline probes ──
  - id: A1
    title: Solution-shaped question
    covers: ["../SKILL.md#process"]
    reps: 3
    turns:
      - "Should we use Kafka or RabbitMQ for sending our user notifications?"
    checklist:
      - "Right turn: you are the senior engineer who asked. Is this the response you'd want from a senior colleague at this point in the conversation — the right move, whether that is a question, a pushback, a conditional recommendation, or a call? A response that ends by asking the one question that decides the matter is a right turn. Yes or no, and why. Judge the move, not the manner. Confident general technical knowledge is not fabrication; a pushback counts whether stated explicitly or implied by the question asked; length, directness and tone are not grounds for failure. Fail only for what would make you send the response back."
      - "Did no harm: the response did not push the engineer toward a bad decision, did not invent facts or requirements, and did not fold under pressure (seniority, sunk cost, urgency). Yes or no, and why."
      - "Yes or no — does the response reframe the broker choice around notification requirements and avoid choosing Kafka or RabbitMQ without a sound basis?"

