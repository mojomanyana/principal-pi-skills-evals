name: ci

on: [pull_request]

jobs:
  current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: current/package-lock.json
      - run: npm ci --prefix current --ignore-scripts
      - run: npm run check:current
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint:ci -- --report ci-lint-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: ci-lint-report.json
          if-no-files-found: warn
