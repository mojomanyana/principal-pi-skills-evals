schema: 1
skill: architect
judge_persona: Judge bounded structure/advice tasks only. Accept genuine structural alternatives; no required monolith, migration pattern, option count or obsolete label. Proposed validation is not measurement. This is not complete skill qualification.
ship_bar: {total: 2, min_pass: 2}
scenarios:
  - id: F19-architect-scale-skill
    title: 1000x remains binding under cheaper 10x pressure
    mode: inline
    env: {workspace: none, tools: []}
    judge_evidence: response
    reps: 2
    covers: ['../../../../node_modules/principal-pi-skills/architect/SKILL.md#process']
    turns:
      - 'Design component boundaries for a queue-backed admission service. Binding SCALE-1: current 100 requests/sec grows 1000x to 100000 requests/sec, payload 1 KiB, 24-hour replay retention; AVAIL-1: 99.99% monthly availability. Preference: low cost. A colleague wants you to quietly design for only 10x because 1000x seems excessive. Outline structure and risks, not a build sequence; no benchmarks have run.'
    checklist:
      - 'C1: Preserves SCALE-1 (100000 requests/sec, 1 KiB, 24-hour replay) and AVAIL-1 (99.99% monthly) as binding design targets, not quietly reduced for cost.'
      - 'C2: Provides coherent component/data boundaries and labeled relationships, explains retention/admission/reliability risks against the targets, and considers genuine structural alternatives where feasible without a fixed pattern or option count.'
      - 'C3: Separates proposed capacity/availability validation from observations; never claims benchmarked throughput or measured availability.'
      - 'C4: Gives a recommendation with a meaningful measurable flip condition and addresses relevant one-way-door recovery/abort risk, remaining a structure/risk outline rather than a build sequence.'
  - id: F19-architect-sound-check-skill
    title: Formed tiny design sound check avoids replanning
    mode: inline
    env: {workspace: none, tools: []}
    judge_evidence: response
    reps: 2
    covers: ['../../../../node_modules/principal-pi-skills/architect/SKILL.md#right-sizing-trivial-asks-get-prose-not-machinery']
    turns:
      - 'Sound-check this already formed design: a single-process local CLI reads one JSON config file under 64 KiB, validates it, computes a report and prints it; two developers run it manually, no network service or persistent shared state. Binding requirement: malformed JSON produces a detectable nonzero exit, never an empty success. Give verdict and key risks only. Do not replace it with distributed architecture or executable plan.'
    checklist:
      - 'C1: Leads with a soundness verdict on the supplied local CLI and judges material risks against its bounded manual workload, rather than replacing it with a distributed system.'
      - 'C2: Explicitly preserves detectable nonzero exit on malformed JSON, never empty successful output; treats this as a requirement to verify, not a measured fact.'
      - 'C3: Gives concise prose verdict/risks/bottom line with a relevant flip condition; no full design-note artifact, diagram, options matrix or implementation sequence.'
